name: Deploy PinjamRuang

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependency dan build Vite
        run: |
          npm ci
          npm run build

      - name: Tes koneksi SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          timeout 10 bash -c '</dev/tcp/$DEPLOY_HOST/$DEPLOY_PORT' \
            && echo "Port SSH dapat dijangkau" \
            || (echo "Port SSH tidak dapat dijangkau"; exit 1)


      - name: Siapkan SSH untuk upload
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_FINGERPRINT: ${{ secrets.DEPLOY_FINGERPRINT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" \
            -t ecdsa "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null

          ssh-keygen -E sha256 -lf ~/.ssh/known_hosts > /tmp/host_fingerprint.txt

          grep -F "$DEPLOY_FINGERPRINT" /tmp/host_fingerprint.txt \
            || { echo "Fingerprint tidak cocok"; exit 1; }

      - name: Upload hasil build Vite
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/public/build'"

          scp -i ~/.ssh/deploy_key \
            -P "$DEPLOY_PORT" \
            -r public/build/. \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/public/build/"


      - name: Update aplikasi di hosting
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            git pull --ff-only origin main

            composer install --no-dev --prefer-dist --optimize-autoloader

            rm -f public/hot

            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache

            echo "Deployment PinjamRuang selesai."
